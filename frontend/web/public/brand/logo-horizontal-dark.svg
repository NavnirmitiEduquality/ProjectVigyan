<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2080 800" width="2080" height="800" fill="none">
  <!-- 2080x800 Genuine RGBA transparent background: logo-horizontal.png -->
  <!-- No background rectangle, exact original proportions and typography preserved -->
  <g transform="translate(91, 181) scale(3.65)">
    <!-- Symbol Container / Icon mark -->
    <g transform="translate(16, 12)">
      <!-- Outer Shield / Emblem soft background -->
      <rect x="0" y="0" width="96" height="96" rx="22" fill="#193D30"/>

      <!-- Muted Gold Subtle Geometric Accent Frame -->
      <rect x="1.5" y="1.5" width="93" height="93" rx="20.5" stroke="#C8A856" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

      <!-- Open Book Base (Foundation of Academic Learning & Curriculum) -->
      <path d="M25 66 C35 63 43 65 48 68 C53 65 61 63 71 66 L71 73 C61 70 53 72 48 75 C43 72 35 70 25 73 Z" fill="#C8A856"/>
      <path d="M25 66 C35 63 43 65 48 68 L48 48 C43 45 35 44 25 46 Z" fill="#FCF9F0" fill-opacity="0.25"/>
      <path d="M71 66 C61 63 53 65 48 68 L48 48 C53 45 61 44 71 46 Z" fill="#FCF9F0" fill-opacity="0.32"/>

      <!-- Integrated Laboratory Flask (Vigyan / Science & Discovery) -->
      <!-- Flask Neck & Lip -->
      <rect x="42.5" y="21" width="11" height="3" rx="1.5" fill="#FCF9F0"/>
      <path d="M44.5 24 L44.5 35 L33 54 C31.5 56.5 33 60 36.5 60 L59.5 60 C63 60 64.5 56.5 63 54 L51.5 35 L51.5 24 Z" stroke="#FCF9F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Flask Fluid / Scientific Energy meniscus -->
      <path d="M36 53.5 C40 51.5 44 54 48 53 C52 52 56 54.5 60 53.5 L60.8 56 C61.8 58 60.5 59.5 58 59.5 L38 59.5 C35.5 59.5 34.2 58 35.2 56 Z" fill="#C8A856"/>

      <!-- Subtle Catalyst / Spark of Learning -->
      <circle cx="48" cy="42" r="2.2" fill="#FCF9F0"/>
      <circle cx="43" cy="47" r="1.5" fill="#FCF9F0" fill-opacity="0.7"/>
      <circle cx="53" cy="48" r="1.3" fill="#FCF9F0" fill-opacity="0.7"/>
    </g>

    <!-- Wordmark & Institutional Subtitle -->
    <g transform="translate(132, 28)">
      <!-- Brand Name "Project Vigyan" -->
      <text x="0" y="40" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.03em" fill="#FCF9F0">Project Vigyan</text>

      <!-- Institutional Subtitle -->
      <text x="1" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.16em" text-transform="uppercase" fill="#A9B5AC">ACADEMIC OPERATIONS &amp; STEM PLATFORM</text>
    </g>
  </g>
</svg>