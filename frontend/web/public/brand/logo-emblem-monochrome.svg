<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- 512x512 Genuine RGBA transparent background: logo-emblem-monochrome.png -->
  <!-- Requirement: Single forest-green (#193D30) artwork on transparent background (NOT white artwork on a green square). -->
  <!-- Centered with generous padding, original emblem symbol drawn directly in pure #193D30 -->
  <g transform="translate(56, 56) scale(4.16)">
    <!-- Outer Shield / Emblem Outline in Forest Green (stroke only, interior fully transparent) -->
    <rect x="2" y="2" width="92" height="92" rx="21" stroke="#193D30" stroke-width="4" fill="none"/>

    <!-- Open Book Base in Forest Green (#193D30) -->
    <path d="M25 66 C35 63 43 65 48 68 C53 65 61 63 71 66 L71 73 C61 70 53 72 48 75 C43 72 35 70 25 73 Z" fill="#193D30"/>
    <!-- Book leaf upper contours -->
    <path d="M25 66 C35 63 43 65 48 68 L48 50 C43 47 35 46 25 48 Z" stroke="#193D30" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <path d="M71 66 C61 63 53 65 48 68 L48 50 C53 47 61 46 71 48 Z" stroke="#193D30" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <line x1="48" y1="50" x2="48" y2="75" stroke="#193D30" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Erlenmeyer Laboratory Flask in Forest Green (#193D30) -->
    <!-- Lip -->
    <rect x="42.5" y="20" width="11" height="3.2" rx="1.6" fill="#193D30"/>
    <!-- Neck & Conical Body -->
    <path d="M44.5 23 L44.5 35 L33 54 C31.5 56.5 33 60 36.5 60 L59.5 60 C63 60 64.5 56.5 63 54 L51.5 35 L51.5 23 Z" stroke="#193D30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Meniscus / Fluid base in Forest Green (#193D30) -->
    <path d="M36 53.5 C40 51.5 44 54 48 53 C52 52 56 54.5 60 53.5 L60.8 56 C61.8 58 60.5 59.5 58 59.5 L38 59.5 C35.5 59.5 34.2 58 35.2 56 Z" fill="#193D30"/>

    <!-- Spark / Insight nodes in Forest Green (#193D30) -->
    <circle cx="48" cy="42" r="2.5" fill="#193D30"/>
    <circle cx="43" cy="47" r="1.8" fill="#193D30"/>
    <circle cx="53" cy="48" r="1.6" fill="#193D30"/>
  </g>
</svg>